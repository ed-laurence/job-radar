# PR security gate. Required check on main: "security-review".
# Triggered by workflow_run after ci.yml, so it always runs from MAIN's definition of this file.
# The branch under review is DATA ONLY: its diff and files are read with git, never checked out
# as the working tree and never executed. Only main's scripts run here.
# GCP: Vertex-only credentials from the review WIF provider (bound to this workflow on main and
# event workflow_run). The result is posted as a check run on the head SHA.
# Local twin: SECURITY_AGENT=1 scripts/check.sh --security
name: security-review

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  checks: write
  id-token: write
  actions: read

concurrency:
  group: security-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    name: security-review
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      WORK: ${{ github.workspace }}/.artifacts/security
    steps:
      - name: Start check run
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'security-review', head_sha: process.env.HEAD_SHA, status: 'in_progress',
            });
            core.setOutput('id', data.id);

      - name: Check out main (trusted code only)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the head commit as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" fetch --no-tags origin "$HEAD_SHA"
          base="$(git merge-base origin/main "$HEAD_SHA")"
          mkdir -p "$WORK/head"
          git diff --no-ext-diff --no-color "$base" "$HEAD_SHA" > "$WORK/diff.patch"
          git diff --name-only --diff-filter=AM "$base" "$HEAD_SHA" > "$WORK/changed.txt"
          # Changed files as plain data for static scanners (no checkout, no hooks, no execution).
          while IFS= read -r f; do
            mkdir -p "$WORK/head/$(dirname "$f")"
            git show "$HEAD_SHA:$f" > "$WORK/head/$f"
          done < "$WORK/changed.txt"
          echo "changed files: $(wc -l < "$WORK/changed.txt")"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
      - name: Install scanners (pinned, checksum-verified)
        run: |
          bash scripts/lib/install-tools.sh --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Write the denylist (never printed)
        env:
          DENYLIST: ${{ secrets.JOBRADAR_DENYLIST }}
        run: |
          umask 077
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          echo "JOBRADAR_DENYLIST=$RUNNER_TEMP/denylist.txt" >> "$GITHUB_ENV"

      - name: Deterministic layer
        id: scanners
        run: |
          set +e
          out="$WORK/scanner-results.txt"; : > "$out"; fail=0
          echo "## gitleaks" >> "$out"
          gitleaks dir "$WORK/head" --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$WORK/gitleaks.json" >/dev/null 2>&1 || fail=1
          python3 scripts/lib/scan_summary.py gitleaks "$WORK/gitleaks.json" >> "$out" || true
          echo "## denylist" >> "$out"
          if [ -s "$JOBRADAR_DENYLIST" ]; then
            python3 scripts/lib/denylist_scan.py "$JOBRADAR_DENYLIST" --stdin-text < "$WORK/diff.patch" >> "$out" || fail=1
          else
            echo "SKIP: JOBRADAR_DENYLIST secret not set" >> "$out"
          fi
          echo "## semgrep" >> "$out"
          semgrep scan --config p/owasp-top-ten $( [ -d .semgrep ] && echo --config .semgrep ) \
            --metrics=off --json --quiet "$WORK/head" > "$WORK/semgrep.json"
          python3 scripts/lib/scan_summary.py semgrep "$WORK/semgrep.json" >> "$out" || fail=1
          if grep -qE '^(infra/|.*\.tf$)' "$WORK/changed.txt"; then
            echo "## checkov" >> "$out"
            checkov -d "$WORK/head" --framework terraform --compact --quiet -o cli >> "$out" 2>&1 || fail=1
          fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "deterministic layer: fail=$fail"

      - name: Authenticate to Vertex (review provider)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_REVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_REVIEW_SA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Security agent (read-only Claude Code on Vertex)
        id: agent
        env:
          CLAUDE_CODE_USE_VERTEX: "1"
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.GCP_REVIEW_PROJECT_ID }}
          CLOUD_ML_REGION: global
          SECURITY_MODEL: claude-opus-5-5
          DISABLE_TELEMETRY: "1"
        run: |
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.322
          rc=0; scripts/lib/security-agent.sh "$WORK" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Complete check run (findings redacted)
        if: always()
        uses: actions/github-script@v7
        env:
          SCANNERS_FAIL: ${{ steps.scanners.outputs.fail }}
          AGENT_RC: ${{ steps.agent.outputs.rc }}
          CHECK_ID: ${{ steps.check.outputs.id }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const work = process.env.WORK;
            const redact = (t) => {
              const list = process.env.JOBRADAR_DENYLIST;
              if (!list || !fs.existsSync(list)) return t;
              return execFileSync('python3', ['scripts/lib/denylist_scan.py', list, '--redact'], { input: t }).toString();
            };
            let findings = { findings: [], verdict: 'changes_requested', error: 'agent did not run' };
            try { findings = JSON.parse(fs.readFileSync(`${work}/findings.json`, 'utf8')); } catch (e) {}
            const rows = (findings.findings || []).map(f =>
              `| ${f.severity} | ${f.citation || '-'} | ${f.file || '-'}:${f.line || '-'} | ${(f.fix || '').replace(/\|/g, '/')} |`);
            const scanners = fs.existsSync(`${work}/scanner-results.txt`) ? fs.readFileSync(`${work}/scanner-results.txt`, 'utf8') : 'not run';
            const ok = process.env.SCANNERS_FAIL === '0' && process.env.AGENT_RC === '0';
            const summary = redact([
              `**Verdict:** ${findings.verdict}${findings.error ? ` (${findings.error})` : ''}`,
              '', '| severity | citation | location | fix |', '|---|---|---|---|', ...rows,
              '', '<details><summary>Deterministic scanners</summary>', '', '```', scanners.slice(0, 20000), '```', '</details>',
            ].join('\n'));
            await core.summary.addRaw(summary).write();
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo, check_run_id: Number(process.env.CHECK_ID),
              status: 'completed', conclusion: ok ? 'success' : 'failure',
              output: { title: ok ? 'No blockers' : 'Blockers found', summary: summary.slice(0, 65000) },
            });
