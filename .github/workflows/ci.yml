# CI: the same gate as local (scripts/check.sh), on agent branches and on every PR.
# - push to agent/**: pushes made with the deploy key trigger workflows (GITHUB_TOKEN PRs don't).
# - pull_request: human PRs.
# No secrets and no GCP credentials here: code from the branch runs, so nothing of value is exposed.
# Required check on main: "ci / check". security-review.yml runs after this via workflow_run.
name: ci

on:
  push:
    branches: ["agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar-local
          POSTGRES_DB: jobradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://jobradar:jobradar-local@127.0.0.1:5432/jobradar
      LLM: replay
      GUARDS: fake
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false
      - name: Install scanners (pinned, checksum-verified)
        run: |
          bash scripts/lib/install-tools.sh --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Fetch main for oasdiff and red-green
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: scripts/check.sh
        run: scripts/check.sh

      - name: Red -> green (agent branches)
        if: startsWith(github.ref, 'refs/heads/agent/')
        run: scripts/lib/red-green.sh --base origin/main --require-tests

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: .artifacts/check/
          retention-days: 7
