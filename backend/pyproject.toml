[project]
name = "job-radar-api"
version = "0.1.0"
description = "Job Radar API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "structlog>=24.4",
  "httpx>=0.28",
  "anthropic[vertex]>=1.0",
  "google-auth>=2.36",
  "pyjwt[crypto]>=2.10",
  "pyyaml>=6.0",
  "tzdata>=2026.6",
  "pypdf>=5.1",
  "reportlab==5.1.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.118",
  "respx>=0.21",
  "schemathesis>=3.38",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "import-linter>=2.1",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
default-groups = ["dev"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/app/generated"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RET", "PTH", "ASYNC",
  "S", "BLE", "FBT", "PL", "RUF", "TRY", "PT", "ARG", "ERA", "G", "LOG", "ANN", "TCH", "PIE",
]
ignore = [
  "TRY003",   # long messages on typed errors are fine
  "PLR2004",  # magic values in tests and limits
  "S101",     # assert is used in tests
  "TC001", "TC002", "TC003",  # runtime imports are needed by FastAPI/Pydantic annotations
  "N818",     # domain errors are named after spec problem types (NotFound, Conflict, ...)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "PLR0913", "ANN401", "ARG001", "FBT001", "PT012"]
"tests/integration/**" = ["E501"]  # SQL literals read better unwrapped
"src/app/adapters/fakes/**" = ["S105"]
"src/app/domain/identity.py" = ["RUF003"]  # the Cyrillic lookalike in a comment is the point
"migrations/**" = ["E501", "PLR0915", "S608"]
# SSE boundary: the streaming twin of the global exception handler. It must catch everything that
# escaped domain handling, log the type only (no message: SEC-07) and end the stream cleanly.
"src/app/api/stream_guard.py" = ["BLE001"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------------ pyright
[tool.pyright]
include = ["src", "tests", "migrations"]
exclude = ["src/app/generated", "**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a real Postgres (DATABASE_URL)",
  "evals: labelled-set evaluations, not in the fast suite",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# ------------------------------------------------------------------ import-linter (ARCH-01/02)
[tool.importlinter]
root_packages = ["app"]
exclude_type_checking_imports = true
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ARCH-01: domain imports only domain, stdlib and pydantic"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
  "app.api", "app.adapters", "app.guards", "app.main", "app.settings", "app.jobs", "app.agents",
  "app.generated",
  "fastapi", "starlette", "sqlalchemy", "asyncpg", "alembic", "httpx", "anthropic", "google",
  "jwt", "structlog", "yaml", "uvicorn",
]

[[tool.importlinter.contracts]]
name = "ARCH-02: routes reach external systems only through domain ports"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["sqlalchemy", "asyncpg", "httpx", "anthropic", "google", "jwt"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ARCH-02: adapters never import routes or the app factory"
type = "forbidden"
source_modules = ["app.adapters", "app.guards"]
forbidden_modules = ["app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
# The coordinator is its own process: a sibling of app.main (neither imports the other) that wires
# adapters into domain services and may not reach app.compose or the HTTP routes in app.api.
layers = [
  "app.main | app.coordinator",
  "app.compose",
  "app.api",
  "app.guards",
  "app.adapters",
  "app.domain",
]
# The one exception: the token format is a pure leaf module (see the contract below) that the
# sandbox runner adapter mints with.
ignore_imports = ["app.adapters.** -> app.coordinator.tokens"]
containers = []
exhaustive = false

[[tool.importlinter.contracts]]
name = "Coordinator tokens are pure (the sandbox runner imports them)"
type = "forbidden"
source_modules = ["app.coordinator.tokens"]
forbidden_modules = [
  "app.adapters", "app.api", "app.compose", "app.guards", "app.main", "app.jobs", "app.agents",
  "app.settings", "app.coordinator.config", "app.coordinator.wiring", "app.coordinator.server",
  "sqlalchemy", "asyncpg", "httpx", "starlette", "fastapi",
]

[[tool.importlinter.contracts]]
name = "Coordinator tools reach the board only through domain services and ports"
type = "forbidden"
source_modules = ["app.coordinator.service", "app.coordinator.schemas"]
forbidden_modules = [
  "app.adapters", "app.api", "app.compose", "app.main", "sqlalchemy", "asyncpg", "httpx",
  "starlette",
]
