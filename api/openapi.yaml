      tags:
      - Task chat
      summary: Send a task chat message (SSE)
      description: |-
        Saves your message (after the content guard; a blocked message is 422 `guard-blocked`) and streams Claude's reply. The card's text, triage and plan reach the model as untrusted data, never as instructions.

        The model may read this card (`get_task`, `get_triage`, `get_plan`) and propose one edit per reply (`propose_task_edit`). Each tool call is a `step` event (`agent` = `task-chat`, `run_id` = the reply's message id). A proposal never changes the card: accept or reject it. Nothing else is reachable: no other cards, the repo or running agents.

