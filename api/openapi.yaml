# Job Radar API contract. Source of truth: edit this file, then run scripts/gen-api.sh.
openapi: 3.1.0
info:
  title: Job Radar API
  version: 0.1.0
  description: |-
    Job Radar HTTP API (M1). Spec-first: this file is the source of truth; server models and the web client are generated from it.

    Conventions:
    - **Auth:** every route needs a verified Identity Platform JWT for an allowlisted account, except `GET /healthz`. There is no sign-up.
    - **Roles:** operations marked `x-required-role: maintainer` return 403 for `user`.
    - **No nulls:** unknown or empty fields are omitted.
    - **Concurrency:** mutable resources carry `version`. Send it on every write (body, or the `version` query parameter on DELETE); a mismatch is 409 with `current_version`.
    - **Ordering:** `rank` is a fractional index string compared in byte order.
    - **Pagination:** cursor-based (`cursor`, `limit`, `next_cursor`).
    - **Errors:** RFC 9457 `application/problem+json` with `correlation_id`, mirrored in `X-Correlation-Id`.
    - **Rate limits:** per-user and per-IP token buckets. `x-rate-limit-tier` (`public`, `default`, `events`, `stream`, `ai`, `agent`) names the bucket; responses carry `RateLimit-*` headers and 429 adds `Retry-After`.
    - **Streaming:** SSE endpoints emit typed events (`segment`, `retract`, `step`, `done`, `error`); every payload passes the redaction filter.
    - **Untrusted text** (ads, task text, web results) is data, never instructions, and is guarded before reaching a model.
  contact:
    name: Job Radar maintainers
    url: https://job-radar.example.test
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /api
  description: Relative to the web origin (proxied to the api service).
security:
- bearerAuth: []
tags:
- name: System
  description: Health.
- name: Settings
  description: The signed-in user's settings (job scraping excluded).
- name: Health
  description: The Health panel (jobs, LLM usage, site usage).
- name: Scan
  description: Job scans (simulated from seed data for now).
- name: Auth
  description: The signed-in account.
- name: Roles
  description: Roles and applications.
- name: Scoring
  description: AI scoring.
- name: Kits
  description: Application kits (streamed).
- name: Chat
  description: Role chat (streamed).
- name: Contacts
  description: Contacts.
- name: Targets
  description: Campaign targets.
- name: Research
  description: Company-research agent.
- name: Campaign
  description: The weekly campaign plan, tasks and activity log.
- name: Alerts
  description: Main-page alerts.
- name: Rejections
  description: Rejection analysis and patterns.
- name: Follow-ups
  description: Follow-up drafts after applying (streamed).
- name: Dashboard
  description: KPIs and chart series.
- name: Analytics
  description: First-party web analytics.
- name: Dev board
  description: Kanban cards and the state machine.
- name: Task chat
  description: Discuss a dev-board card with Claude; it proposes edits you accept or reject (streamed).
- name: Runs
  description: Agent runs and steps.
paths:
  /healthz:
    servers:
    - url: /
      description: api service root (uptime checks).
    get:
      operationId: getHealth
      tags:
      - System
      summary: Liveness
      description: 'Returns `{status: ok}` and nothing else. Unauthenticated.'
      security: []
      responses:
        '200':
          description: Up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: public
  /me:
    get:
      operationId: getMe
      tags:
      - Auth
      summary: Current user
      description: 'The signed-in account and its role. There is no sign-up endpoint: accounts are provisioned out of band.'
      responses:
        '200':
          description: The caller.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
  /roles:
    get:
      operationId: listRoles
      tags:
      - Roles
      summary: List roles
      description: Roles and applications visible to the caller (row-level security). Soft-deleted rows are excluded.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        description: Filter by status (repeatable).
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RoleStatus'
          maxItems: 9
      - name: stage
        in: query
        description: Filter by stage (repeatable).
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RoleStage'
          maxItems: 7
      - name: track
        in: query
        description: Filter by track.
        schema:
          $ref: '#/components/schemas/Track'
      - name: min_score
        in: query
        description: Minimum score.
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - name: min_age_days
        in: query
        description: Only roles older than this many days. Age is measured from `posted_at`, falling back to `found_at`. 422 when greater than `max_age_days`.
        schema:
          type: integer
          minimum: 0
          maximum: 365
      - name: max_age_days
        in: query
        description: Only roles posted within this many days (age from `posted_at`, falling back to `found_at`).
        schema:
          type: integer
          minimum: 0
          maximum: 365
      - name: q
        in: query
        description: Case-insensitive match on title or company.
        schema:
          type: string
          maxLength: 100
      - name: sort
        in: query
        description: Sort order. `rank` is the pipeline order within a status.
        schema:
          type: string
          enum:
          - rank
          - -found_at
          - -score
          - -posted_at
          maxLength: 10
          default: rank
      responses:
        '200':
          description: A page of roles.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
    post:
      operationId: createRole
      tags:
      - Roles
      summary: Import a role
      description: Manual import (pasted ad or link). The ad text is guarded before any LLM sees it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Created.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
  /roles/{roleId}:
    parameters:
    - $ref: '#/components/parameters/RoleId'
    get:
      operationId: getRole
      tags:
      - Roles
      summary: Get a role
      description: One role with its kit.
      responses:
        '200':
          description: The role.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
    patch:
      operationId: updateRole
      tags:
      - Roles
      summary: Update a role
      description: Partial update with optimistic `version`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Updated.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
    delete:
      operationId: deleteRole
      tags:
      - Roles
      summary: Delete a role
      description: Soft delete. The row is kept (dedupe) but hidden.
      parameters:
      - $ref: '#/components/parameters/Version'
      responses:
        '204':
          description: Deleted.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
  /roles/{roleId}/status:
    parameters:
    - $ref: '#/components/parameters/RoleId'
    post:
      operationId: changeRoleStatus
      tags:
      - Roles
      summary: Change status
      description: Moves the role to another pipeline column and writes a role event. Setting `applied` the first time sets
        `applied_at`; `rejected` creates the rejection record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleStatusChange'
      responses:
        '200':
          description: Updated.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
  /roles/{roleId}/rank:
    parameters:
    - $ref: '#/components/parameters/RoleId'
    post:
      operationId: reorderRole
      tags:
      - Roles
      summary: Reorder in pipeline
      description: Sets the fractional `rank` within the current status column (drag and drop).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankChange'
      responses:
        '200':
          description: Updated.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
  /roles/{roleId}/events:
    parameters:
    - $ref: '#/components/parameters/RoleId'
    get:
      operationId: listRoleEvents
      tags:
      - Roles
      summary: Role history
      description: Status, note and kit events, newest first.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of events.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
  /roles/{roleId}/score:
    parameters:
    - $ref: '#/components/parameters/RoleId'
    post:
      operationId: scoreRole
      tags:
      - Scoring
      summary: Score a role
      description: Queues AI scoring for the role. Capped by the daily per-feature budget.
      responses:
        '202':
          description: Accepted.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: ai
  /roles/{roleId}/evidence:
    parameters:
    - $ref: '#/components/parameters/RoleId'
    get:
      operationId: getRoleEvidence
      tags:
      - Scoring
      summary: Latest evidence test
      description: >-
        The latest full evidence test for the role: each must-have from the ad, whether the
        user's CV or records show it (with the exact quote), the code-derived verdict and the
        team-size check. 404 if the role is not the caller's or has never been checked.
      responses:
        '200':
          description: The latest evidence test.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEvidenceTest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
    post:
      operationId: runRoleEvidence
      tags:
      - Scoring
      summary: Run the evidence test
      description: >-
        Runs the evidence test now ("Run again", and after the user saves an experience record
        from "I've done this"): extracts the ad's must-haves and matches each against the
        user's CV texts, extra skills and experience records. Quotes not found verbatim in
        those texts are downgraded to `partial` without a quote. Stores and returns the result,
        and refreshes the role's evidence summary. 422 if the role has no ad text.
      responses:
        '200':
          description: The new evidence test.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEvidenceTest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: ai
  /roles/{roleId}/kit:
    parameters:
    - $ref: '#/components/parameters/RoleId'
    post:
      operationId: generateKit
      tags:
      - Kits
      summary: Generate a kit (SSE)
      description: Streams the application kit as `segment` events, with `retract` for segments flagged after release, then
        `done` (with the new kit version) or `error`. 409 if a kit is already being generated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitRequest'
      responses:
        '200':
          description: Event stream.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/GenerationStreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: ai
  /roles/{roleId}/kit/cover-letter.pdf:
    parameters:
    - $ref: '#/components/parameters/RoleId'
    get:
      operationId: getKitCoverLetterPdf
      tags:
      - Kits
      summary: Download the cover letter
      description: >-
        The kit's cover letter as a one-page A4 PDF: your name and contact line (from your profile settings), today's date in your display time zone, the addressee (`letter_to`, else "Hiring Team, <company>"), a bold "Re:" line (`letter_re`, else the role title) and the letter, with **bold** lead-ins. File name "<Name>_Cover_Letter_<Company>.pdf". 404 when the role has no cover letter yet.
      parameters:
      - name: download
        in: query
        description: Attachment (true, the default) or inline (false) Content-Disposition.
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: The PDF.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Content-Disposition:
              description: attachment or inline, with the file name.
              schema:
                type: string
                maxLength: 400
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                maxLength: 1048576
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-rate-limit-tier: default
  /roles/{roleId}/kit/cv.pdf:
    parameters:
    - $ref: '#/components/parameters/RoleId'
    get:
      operationId: getKitCvPdf
      tags:
      - Kits
      summary: Download the CV for this role
      description: >-
        Your stored CV for the role's track: the leadership CV for exec-track roles, otherwise the technical CV, falling back to whichever is uploaded. File name "<Name>_CV.pdf". 404 when no CV is uploaded.
      parameters:
      - name: download
        in: query
        description: Attachment (true, the default) or inline (false) Content-Disposition.
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: The PDF.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Content-Disposition:
              description: attachment or inline, with the file name.
              schema:
                type: string
                maxLength: 400
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                maxLength: 5242880
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
