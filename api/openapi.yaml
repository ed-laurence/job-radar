          description: Written by the planner against the repo (triage writes none). Each test id names an existing
            test file, or a new one in a directory that exists.
        acceptance_tests:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 50
          description: Frozen failing test ids written by the test-only step.
        tests_to_change:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 50
          description: Existing test files the plan has to edit (existing tests are read-only otherwise). Approving with
            `allow_test_changes` adds the matching `modify-tests:` label.
