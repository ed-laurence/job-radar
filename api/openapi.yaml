  /tasks/{taskId}/move:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    post:
      operationId: moveTask
      tags:
      - Dev board
      summary: Move a card
      description: |-
        Moves a card to `to_column` at `rank`. The server state machine decides; the client never forces a column.

        User moves allowed (anything else returns 422 `illegal-transition` with `allowed_columns`; a stale `version` returns 409):

        | from | to | notes |
        |---|---|---|
        | any | same column | reorder |
        | `out_of_scope` | `backlog` | after a rewrite; triage re-runs |
        | `triaged` | `plan_review` | maintainer; starts the dev-lead plan |
        | `plan_review` | `ready` | maintainer; needs approved tests + plan, else 422 `plan-not-approved` (use `approveTaskPlan`) |
        | `ready` | `agent_dev` | maintainer; starts the dev run |
        | `triaged`, `plan_review`, `ready` | `backlog` | back out |
        | any except `done`, `agent_dev`, `agent_review` | `blocked` | `reason` required |
        | `blocked` | the column it came from, or `backlog` | |
        | `human_review` | `done` | maintainer; stands in for the merge webhook locally |
        | `human_review` | `changes_requested` | maintainer; `reason` (the notes) required; starts a rework dev run |

        System-only moves: `backlog`→`triaged`/`out_of_scope` (triage), `agent_dev`→`agent_review`, `agent_review`→`human_review`/`changes_requested`, `changes_requested`→`agent_dev`, `human_review`→`done` (the merge webhook, once on GitHub). `out_of_scope` can never move to `ready`. A `user` asking for a maintainer move gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMove'
      responses:
        '200':
          description: Moved.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
