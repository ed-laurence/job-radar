        offer_rate: {type: [number, 'null'], minimum: 0, maximum: 1}
        ghost_rate: {type: [number, 'null'], minimum: 0, maximum: 1, description: Applications marked unknown (no reply).}
        median_days_to_response: {type: [number, 'null'], minimum: 0}
        followup_on_time_rate: {type: [number, 'null'], minimum: 0, maximum: 1}
        by_source:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/InsightBreakdown'
        by_track:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/InsightBreakdown'
        score_bands:
          type: array
          maxItems: 10
          description: Outcomes by score band, to check the scorer predicts results.
          items:
            $ref: '#/components/schemas/InsightBreakdown'
        as_of: {type: string, format: date-time, maxLength: 40}
    InsightBreakdown:
      type: object
      required: [key, found, applied, interviews, rejected]
      properties:
        key: {type: string, maxLength: 40}
        found: {type: integer, minimum: 0}
        applied: {type: integer, minimum: 0}
        interviews: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
    DashboardKpis:
      type: object
      required:
      - open_roles
      - applied_in_range
      - llm_spend_aud
      - tasks_in_flight
      - as_of
      properties:
        open_roles:
          type: integer
          minimum: 0
        applied_in_range:
          type: integer
          minimum: 0
        interview_rate:
          type: number
          minimum: 0
          maximum: 1
        median_post_to_apply_hours:
          type: number
          minimum: 0
        llm_spend_aud:
          type: number
          minimum: 0
          description: LLM spend in the range, in AUD (the providers' USD cost at `USD_TO_AUD`).
        agent_pass_rate:
          type: number
          minimum: 0
          maximum: 1
        tasks_in_flight:
          type: integer
          minimum: 0
        as_of:
          type: string
          format: date-time
          maxLength: 40
    FunnelSeries:
      type: object
      description: Count of roles that ever reached each status in the range (from role events).
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - status
            - count
            properties:
              status:
                $ref: '#/components/schemas/RoleStatus'
              count:
                type: integer
                minimum: 0
          maxItems: 20
    PostToApplySeries:
      type: object
      required:
      - items
      properties:
        median_hours:
          type: number
          minimum: 0
        p75_hours:
          type: number
          minimum: 0
        items:
          type: array
          items:
            type: object
            required:
            - period_start
            - count
            properties:
              period_start:
                type: string
                format: date
                maxLength: 10
              median_hours:
                type: number
                minimum: 0
              count:
                type: integer
                minimum: 0
          maxItems: 400
    ScoreDistribution:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - min
            - max
            - count
            properties:
              min:
                type: integer
                minimum: 0
                maximum: 100
              max:
                type: integer
                minimum: 0
                maximum: 100
              count:
                type: integer
                minimum: 0
          maxItems: 20
    RejectionReasonSeries:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - category
            - count
            properties:
              category:
                $ref: '#/components/schemas/RejectionCategory'
              count:
                type: integer
                minimum: 0
          maxItems: 20
    LlmSpendSeries:
      type: object
      description: Spend of the caller's own calls (dev-agent calls are attributed to the maintainer who triggered them).
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - period_start
            - feature
            - provider
            - calls
            - cost_aud
            properties:
              period_start:
                type: string
                format: date
                maxLength: 10
              feature:
                $ref: '#/components/schemas/LlmFeature'
              provider:
                $ref: '#/components/schemas/LlmProvider'
              calls:
                type: integer
                minimum: 0
              input_tokens:
                type: integer
                minimum: 0
              output_tokens:
                type: integer
                minimum: 0
              cost_aud:
                type: number
                minimum: 0
                description: In AUD (the providers' USD cost at `USD_TO_AUD`).
          maxItems: 2000
    CycleTimeSeries:
      type: object
      description: Time spent in each column, from task events.
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - column
            - samples
            properties:
              column:
                $ref: '#/components/schemas/TaskColumn'
              median_hours:
                type: number
                minimum: 0
              p75_hours:
                type: number
                minimum: 0
              samples:
                type: integer
                minimum: 0
          maxItems: 11
    AgentPassRateSeries:
      type: object
      description: A dev run passes when its first review round has zero blockers.
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - period_start
            - mode
            - runs
            - passed
            properties:
              period_start:
                type: string
                format: date
                maxLength: 10
              mode:
                type: string
                enum:
                - single
                - multi
                maxLength: 6
              runs:
                type: integer
                minimum: 0
              passed:
                type: integer
                minimum: 0
              pass_rate:
                type: number
                minimum: 0
                maximum: 1
          maxItems: 400
    PageViewEvent:
      type: object
      required:
      - type
      - route
      - at
      - session_id
      properties:
        type:
          type: string
          const: page_view
          maxLength: 9
        route:
          type: string
          maxLength: 200
          pattern: ^/$|^(/([a-z]+(-[a-z]+)*|\[[a-z][a-zA-Z]{0,30}\]))+$
          description: Route template only, e.g. `/roles/[roleId]`. Segments are lower-case words or `[param]`; ids and digits
            are rejected.
        at:
          type: string
          format: date-time
          maxLength: 40
        session_id:
          type: string
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]{16,32}$
          description: Random id generated in the browser, rotated daily. Not a user id.
      additionalProperties: false
    ProductEvent:
      type: object
      required:
      - type
      - name
      - route
      - at
      - session_id
      properties:
        type:
          type: string
          const: product
          maxLength: 7
        route:
          type: string
          maxLength: 200
          pattern: ^/$|^(/([a-z]+(-[a-z]+)*|\[[a-z][a-zA-Z]{0,30}\]))+$
          description: Route template only, e.g. `/roles/[roleId]`. Segments are lower-case words or `[param]`; ids and digits
            are rejected.
        at:
          type: string
          format: date-time
          maxLength: 40
        session_id:
          type: string
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]{16,32}$
          description: Random id generated in the browser, rotated daily. Not a user id.
        name:
          type: string
          enum:
          - kit_generated
          - chat_sent
          - role_created
          - role_moved
          - card_moved
          - agent_run_started
          - agent_run_approved
          - research_started
          maxLength: 18
      additionalProperties: false
    WebVitalEvent:
      type: object
      required:
      - type
      - metric
      - value
      - route
      - at
      - session_id
      properties:
        type:
          type: string
          const: web_vital
          maxLength: 9
        route:
          type: string
          maxLength: 200
          pattern: ^/$|^(/([a-z]+(-[a-z]+)*|\[[a-z][a-zA-Z]{0,30}\]))+$
          description: Route template only, e.g. `/roles/[roleId]`. Segments are lower-case words or `[param]`; ids and digits
            are rejected.
        at:
          type: string
          format: date-time
          maxLength: 40
        session_id:
          type: string
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]{16,32}$
          description: Random id generated in the browser, rotated daily. Not a user id.
        metric:
          type: string
          enum:
          - LCP
          - INP
          - CLS
          - FCP
          - TTFB
          maxLength: 4
        value:
          type: number
          minimum: 0
          maximum: 600000
        rating:
          type: string
          enum:
          - good
          - needs-improvement
          - poor
          maxLength: 17
      additionalProperties: false
    WebEvent:
      oneOf:
      - $ref: '#/components/schemas/PageViewEvent'
      - $ref: '#/components/schemas/ProductEvent'
      - $ref: '#/components/schemas/WebVitalEvent'
      discriminator:
        propertyName: type
        mapping:
          page_view: '#/components/schemas/PageViewEvent'
          product: '#/components/schemas/ProductEvent'
          web_vital: '#/components/schemas/WebVitalEvent'
    WebEventBatch:
      type: object
      description: 'No free text anywhere: every field is an enum, a number, a timestamp or a pattern-checked template.'
      required:
      - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebEvent'
          maxItems: 50
          minItems: 1
      additionalProperties: false
      examples:
      - events:
        - type: page_view
          route: /roles/[roleId]
          at: '2026-11-25T01:00:00Z'
          session_id: abcdEFGH1234ijkl
        - type: web_vital
          metric: LCP
          value: 1830
          rating: good
          route: /dashboard
          at: '2026-11-25T01:00:02Z'
          session_id: abcdEFGH1234ijkl
    WebEventAck:
      type: object
      required:
      - accepted
      properties:
        accepted:
          type: integer
          minimum: 0
    AnalyticsSummary:
      type: object
      required:
      - views_by_page
      - funnels
      - web_vitals
      properties:
        views_by_page:
          type: array
          items:
            type: object
            required:
            - route
            - views
            properties:
              route:
                type: string
                maxLength: 200
                pattern: ^/$|^(/([a-z]+(-[a-z]+)*|\[[a-z][a-zA-Z]{0,30}\]))+$
                description: Route template only, e.g. `/roles/[roleId]`. Segments are lower-case words or `[param]`; ids
                  and digits are rejected.
              views:
                type: integer
                minimum: 0
              sessions:
                type: integer
                minimum: 0
          maxItems: 200
        funnels:
          type: array
          items:
            type: object
            required:
            - name
            - steps
            properties:
              name:
                type: string
                maxLength: 64
              steps:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - sessions
                  properties:
                    name:
                      type: string
                      maxLength: 64
                    sessions:
                      type: integer
                      minimum: 0
                maxItems: 10
          maxItems: 20
        web_vitals:
          type: array
          items:
            type: object
            required:
            - route
            - metric
            - p75
            - samples
            properties:
              route:
                type: string
                maxLength: 200
                pattern: ^/$|^(/([a-z]+(-[a-z]+)*|\[[a-z][a-zA-Z]{0,30}\]))+$
                description: Route template only, e.g. `/roles/[roleId]`. Segments are lower-case words or `[param]`; ids
                  and digits are rejected.
              metric:
                type: string
                enum:
                - LCP
                - INP
                - CLS
                - FCP
                - TTFB
                maxLength: 4
              p75:
                type: number
                minimum: 0
              budget:
                type: number
                minimum: 0
              samples:
                type: integer
                minimum: 0
              over_budget:
                type: boolean
          maxItems: 500
