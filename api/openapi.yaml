      name: roleId
      in: path
      required: true
      description: Role id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    DocumentSlot:
      name: slot
      in: path
      required: true
      description: Document slot.
      schema:
        $ref: '#/components/schemas/DocumentSlot'
    ExperienceId:
      name: experienceId
      in: path
      required: true
      description: Experience record id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    ContactId:
      name: contactId
      in: path
      required: true
      description: Contact id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    TargetId:
      name: targetId
      in: path
      required: true
      description: Target id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    TaskId:
      name: taskId
      in: path
      required: true
      description: Dev task id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    ProposalId:
      name: proposalId
      in: path
      required: true
      description: Task chat proposal id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    RunId:
      name: runId
      in: path
      required: true
      description: Agent run id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    ResearchRunId:
      name: researchRunId
      in: path
      required: true
      description: Research run id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    CampaignWeek:
      name: week
      in: query
      description: 'Campaign week (1 = the plan''s first week). Default: the current week.'
      schema:
        type: integer
        minimum: 1
        maximum: 52
    CampaignWeekRequired:
      name: week
      in: query
      required: true
      description: Campaign week (1 = the plan's first week).
      schema:
        type: integer
        minimum: 1
        maximum: 52
    CampaignTaskId:
      name: taskId
      in: path
      required: true
      description: Campaign task id from the plan.
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z0-9_-]{1,64}$
    ActivityId:
      name: activityId
      in: path
      required: true
      description: Logged activity id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Version:
      name: version
      in: query
      required: true
      description: Current version of the resource (optimistic concurrency).
      schema:
        type: integer
        minimum: 1
    From:
      name: from
      in: query
      description: 'Inclusive start date (UTC). Default: 90 days ago.'
      schema:
        type: string
        format: date
        maxLength: 10
    To:
      name: to
      in: query
      description: 'Exclusive end date (UTC). Default: tomorrow.'
      schema:
        type: string
        format: date
        maxLength: 10
    Bucket:
      name: bucket
      in: query
      description: Time bucket for series.
      schema:
        type: string
        enum:
        - day
        - week
        - month
        maxLength: 5
        default: week
    LastEventId:
      name: Last-Event-ID
      in: header
      description: Resume a step stream after this step `seq`.
      schema:
        type: string
        maxLength: 64
        pattern: ^[0-9]{1,12}$
  headers:
    X-Correlation-Id:
      description: Correlation id, also in the problem body and server logs.
      schema:
        type: string
        maxLength: 64
    RateLimit-Limit:
      description: Requests allowed in the current window for this route tier.
      schema:
        type: integer
        minimum: 0
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema:
        type: integer
        minimum: 0
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: Malformed request (`bad-request`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid token (`unauthenticated`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Account not allowed, email not verified, or role too low (`forbidden`). The message never says which.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or not visible to this user (`not-found`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version mismatch (`version-conflict`, with `current_version`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Body over the size limit (`payload-too-large`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Valid JSON that breaks a rule (`validation-failed`, `guard-blocked`, `illegal-transition`, `plan-not-approved`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit or spend budget hit (`rate-limited`, `budget-exceeded`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected error (`internal`). Only the correlation id is useful.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Every non-2xx response uses this shape with `application/problem+json`.
      required:
      - type
      - title
      - status
      - correlation_id
      properties:
        type:
          type: string
          maxLength: 200
          format: uri-reference
          description: Problem type. One of `/problems/{bad-request, unauthenticated, forbidden, not-found, version-conflict,
            illegal-transition, plan-not-approved, validation-failed, guard-blocked, payload-too-large, rate-limited, budget-exceeded,
            internal}`.
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
          description: Human-readable, redacted. Never contains stack traces, SQL or hostnames.
        instance:
          type: string
          maxLength: 500
          format: uri-reference
        correlation_id:
          type: string
          maxLength: 64
          description: Matches the `X-Correlation-Id` header and the server log entry.
        errors:
          type: array
          items:
            type: object
            required:
            - pointer
            - message
            properties:
              pointer:
                type: string
                maxLength: 200
                description: JSON Pointer into the request body.
              message:
                type: string
                maxLength: 300
          maxItems: 50
        current_version:
          type: integer
          minimum: 1
          description: Present on `version-conflict`.
        allowed_columns:
          type: array
          items:
            $ref: '#/components/schemas/TaskColumn'
          maxItems: 11
          description: Present on `illegal-transition`.
      examples:
      - type: /problems/version-conflict
        title: Version conflict
        status: 409
        detail: The resource changed since you read it.
        correlation_id: c0ffee00-0000-4000-8000-000000000001
        current_version: 4
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ok
          maxLength: 2
      additionalProperties: false
    AppRole:
      type: string
      enum:
      - maintainer
      - user
      maxLength: 10
      description: '`maintainer` can trigger dev agents and see admin views; `user` covers everything else.'
    Me:
