    PlanApproval:
      type: object
      description: Approves the frozen acceptance tests and the plan together, and moves the card to `ready`.
      required:
      - plan_version
      - task_version
      - approve_tests
      - approve_plan
      properties:
        plan_version:
          type: integer
          minimum: 1
          description: Optimistic concurrency version. Send the version you read; a mismatch returns 409.
        task_version:
          type: integer
          minimum: 1
          description: Optimistic concurrency version. Send the version you read; a mismatch returns 409.
        approve_tests:
          type: boolean
          const: true
        approve_plan:
          type: boolean
          const: true
        allow_test_changes:
          type: boolean
          description: Required (true) when the plan lists `tests_to_change` not already covered by a `modify-tests:`
            label; adds that label. 422 otherwise.
        rank:
          type: string
          maxLength: 64
          pattern: ^[0-9A-Za-z]{1,64}$
          description: Fractional index. Items sort by byte order (COLLATE "C"). The client computes a key between its new
            neighbours; the server may rebalance keys.
      additionalProperties: false
      examples:
      - plan_version: 1
        task_version: 4
        approve_tests: true
        approve_plan: true
    KillRequest:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency version. Send the version you read; a mismatch returns 409.
        reason:
          type: string
          maxLength: 500
      additionalProperties: false
      examples:
      - version: 7
        reason: Budget looks wrong
